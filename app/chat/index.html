<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verinle Konuş · SAP CAP + Gen AI Hub</title>
  <style>
    :root { --bg:#0b1120; --panel:#111827; --accent:#0a6ed1; --text:#e5e7eb; --muted:#9ca3af; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 24px; background:var(--panel); border-bottom:1px solid #1f2937; }
    header h1 { margin:0; font-size:18px; } header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    main { max-width:860px; margin:0 auto; padding:24px; }
    .examples { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .examples button { background:#1f2937; color:var(--text); border:1px solid #374151; border-radius:18px; padding:6px 12px; cursor:pointer; font-size:13px; }
    .examples button:hover { border-color:var(--accent); }
    #log { display:flex; flex-direction:column; gap:14px; margin-bottom:16px; }
    .msg { padding:12px 14px; border-radius:10px; max-width:90%; white-space:pre-wrap; line-height:1.45; }
    .user { align-self:flex-end; background:var(--accent); }
    .bot { align-self:flex-start; background:var(--panel); border:1px solid #1f2937; }
    .meta { color:var(--muted); font-size:12px; margin-top:8px; }
    table { border-collapse:collapse; margin-top:10px; font-size:13px; width:100%; }
    th, td { border:1px solid #374151; padding:6px 8px; text-align:left; }
    th { background:#1f2937; }
    .row { display:flex; gap:8px; }
    input { flex:1; padding:12px; border-radius:8px; border:1px solid #374151; background:#0f172a; color:var(--text); font-size:15px; }
    .send { padding:12px 20px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:15px; }
    .send:disabled { opacity:.5; cursor:default; }
    details { margin-top:8px; } summary { cursor:pointer; color:var(--muted); font-size:12px; }
    pre { background:#0f172a; padding:8px; border-radius:6px; overflow:auto; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>💬 Verinle Konuş</h1>
    <p>SAP CAP (Node.js) + SAP Generative AI Hub — doğal dilde satış verisi sorgulama</p>
  </header>
  <main>
    <div class="examples" id="examples">
      <button>En pahalı 5 ürün hangisi?</button>
      <button>Teslim edilen siparişler neler?</button>
      <button>Hangi müşterilerimiz var?</button>
      <button>Aksesuar kategorisindeki ürünleri göster</button>
    </div>
    <div id="log"></div>
    <div class="row">
      <input id="q" placeholder="Bir soru yazın… (örn: en yüksek tutarlı siparişler)" autofocus />
      <button class="send" id="send">Sor</button>
    </div>
  </main>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('q');
    const send = document.getElementById('send');

    function bubble(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      log.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
      return div;
    }

    function renderTable(rows) {
      if (!rows || !rows.length) return null;
      const cols = Object.keys(rows[0]).filter(k => k !== '__proto__');
      const t = document.createElement('table');
      t.innerHTML = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>' +
        rows.map(r => '<tr>' + cols.map(c => `<td>${r[c] ?? ''}</td>`).join('') + '</tr>').join('');
      return t;
    }

    async function ask(question) {
      bubble(question, 'user');
      input.value = '';
      send.disabled = true;
      const thinking = bubble('Düşünüyorum…', 'bot');
      try {
        const res = await fetch('/chat/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body?.error?.message || 'Hata');
        thinking.textContent = body.answer || '(boş yanıt)';
        const table = renderTable(body.data);
        if (table) thinking.appendChild(table);
        const det = document.createElement('details');
        det.innerHTML = `<summary>Çalıştırılan sorgu planı</summary><pre>${body.query}</pre>`;
        thinking.appendChild(det);
      } catch (e) {
        thinking.textContent = '⚠️ ' + e.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.onclick = () => input.value.trim() && ask(input.value.trim());
    input.onkeydown = (e) => { if (e.key === 'Enter' && input.value.trim()) ask(input.value.trim()); };
    document.getElementById('examples').onclick = (e) => {
      if (e.target.tagName === 'BUTTON') ask(e.target.textContent);
    };
  </script>
</body>
</html>
